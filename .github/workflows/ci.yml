name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    # macOS too: its bash is 3.2, which the merge scripts must keep working on.
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: git config --global user.name ci && git config --global user.email ci@example.com
      - run: npm test
