# The check `foreman merge` waits for (requiredCheck in foreman.config.json: the job's name, "verify").
# Put the same command here that Builders run before opening a PR (verifyCommand).
name: Verify

on:
  pull_request:
  push:
    branches: [__BASE__]

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: __VERIFY__
